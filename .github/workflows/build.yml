name: Build BakaSU LKM for YAAP waffle

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: yaap/kernel_oneplus_sm8650 commit (hash from uname -r)
        default: 6b7cc6b40d92bac4cd2e399be260497e02fff26b
      config:
        description: kernel config file in this repo (IKCONFIG from boot.img)
        default: yaap_waffle_20261029.config
      ksu_ref:
        description: Baka-SU/BakaSU tag, must match manager version
        default: v4.2.0-rc3

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Deps and clang
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev
          mkdir clang
          curl -fsSL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz | tar xz -C clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: Kernel source
        run: |
          git init -q k && cd k
          git remote add o https://github.com/yaap/kernel_oneplus_sm8650
          git fetch -q --depth 1 o ${{ inputs.kernel_ref }}
          git checkout -q FETCH_HEAD

      - name: Prepare kernel tree
        working-directory: k
        run: |
          mkdir out && cp ../${{ inputs.config }} out/.config
          # vermagic must equal running kernel's uname -r: 6.1.177-@<short hash>
          short=$(echo ${{ inputs.kernel_ref }} | cut -c1-8)
          scripts/config --file out/.config -d LTO_CLANG_THIN -d LTO_CLANG -e LTO_NONE \
            -d LOCALVERSION_AUTO --set-str LOCALVERSION "-@$short"
          export LOCALVERSION=
          make O=out olddefconfig
          make O=out -j$(nproc) modules_prepare
          make O=out -j$(nproc) security/selinux/built-in.a
          cat out/include/generated/utsrelease.h

      - name: Build kernelsu.ko
        run: |
          git clone -q --filter=blob:none -b ${{ inputs.ksu_ref }} https://github.com/Baka-SU/BakaSU ksu
          cd ksu/kernel
          # no vmlinux/Module.symvers: modpost only warns on unresolved symbols, ksuinit resolves them via kallsyms
          make -C ../../k/out M=$PWD src=$PWD -j$(nproc) modules \
            CONFIG_KSU=m CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_TRACEPOINT_HOOK=y KBUILD_MODPOST_WARN=1
          llvm-strip -d kernelsu.ko
          strings kernelsu.ko | grep -E '^vermagic=|ReSukiSU' | head

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ inputs.ksu_ref }}-yaap-${{ inputs.kernel_ref }}
          path: ksu/kernel/kernelsu.ko
