name: Build KernelSU LKM for YAAP waffle

# Reproduces the ROM's kernel build so the module matches the running kernel:
# - config from the device tree fragments (the IKCONFIG embedded in boot.img is stale and bootloops modules)
# - the exact clang build the ROM used (see /proc/version: "Android (15071444, ...")
# - full vmlinux with ThinLTO, KernelSU built in-tree as drivers/kernelsu (intree=Y), like the ROM dev's LKM

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: yaap/kernel_oneplus_sm8650 commit (hash from uname -r)
        default: 6b7cc6b40d92bac4cd2e399be260497e02fff26b
      ksu_repo:
        description: KernelSU fork (KernelSU-Next/KernelSU-Next reproduces the ROM dev's module)
        default: Baka-SU/BakaSU
      ksu_ref:
        description: tag in ksu_repo, must match the manager version
        default: v4.2.0-rc3
      ksu_config:
        description: extra Kconfig lines for the fork (empty for KernelSU-Next)
        default: CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_TRACEPOINT_HOOK=y
      clang_commit:
        description: platform/prebuilts/clang/host/linux-x86 commit holding the ROM's clang-r596125 build
        default: 9b144befdfd93b90e02c663504fb9f4b95f9faf8

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
    steps:
      - name: Free disk (the image leaves ~10 GB on a 72 GB root)
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /opt/az /usr/lib/mono /usr/local/share/chromium
          sudo apt-get clean
          df -h /

      - uses: actions/cache@v4
        id: clang
        with:
          path: clang
          key: clang-r596125 # r596125 is hardcoded in the URL below; bump both together

      - name: Download clang (slow, cached afterwards)
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -fsSL --retry 3 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${{ inputs.clang_commit }}/clang-r596125.tar.gz | tar xz -C clang

      - name: Save clang cache (the post-step never runs when the job dies)
        if: steps.clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang
          key: clang-r596125

      - name: Deps (packages)
        run: |
          set -euxo pipefail
          free -h; df -h / /mnt
          # dwarves (pahole) for DEBUG_INFO_BTF / BTF_MODULES
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev dwarves

      - name: Deps (swap, sized from what is actually free)
        run: |
          set -euxo pipefail
          # /mnt is the same device as / here, so one budget for swap + kernel tree + out dir.
          # The runner has 8 GB RAM; the ThinLTO vmlinux link needs the overflow.
          avail=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          size=$(( avail - 28 ))   # ~25 G for the tree + out dir, leave 28 G
          [ "$size" -gt 12 ] && size=12
          echo "avail=${avail}G swap=${size}G"
          if [ "$size" -lt 4 ]; then echo "::warning::only ${avail}G free, skipping swap"; exit 0; fi
          # /swapfile already exists in the image (3 G, in use) -> 'Text file busy'
          sudo swapoff /swapfile.extra 2>/dev/null || true
          sudo rm -f /swapfile.extra
          sudo fallocate -l ${size}G /swapfile.extra
          sudo chmod 600 /swapfile.extra
          sudo mkswap /swapfile.extra
          sudo swapon /swapfile.extra
          sudo sysctl -w vm.swappiness=60
          sudo swapon --show; free -h

      - name: Deps (clang on PATH)
        run: |
          set -euxo pipefail
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          clang/bin/clang --version | head -1

      - name: Sources
        run: |
          # a full kernel build needs ~25 GB; / on the runner is too small, /mnt has room
          sudo mkdir -p /mnt/k && sudo chown $USER /mnt/k && ln -s /mnt/k k
          git -C k init -q && git -C k remote add o https://github.com/yaap/kernel_oneplus_sm8650
          git -C k fetch -q --depth 1 o ${{ inputs.kernel_ref }} && git -C k checkout -q FETCH_HEAD
          # full history: KSU derives its version code from the commit count
          git clone -q --filter=blob:none -b ${{ inputs.ksu_ref }} https://github.com/${{ inputs.ksu_repo }} ksu

      - name: Config (gki_defconfig + device tree fragments)
        working-directory: k
        run: |
          # oplus drivers are symlinks into repos outside this tree; stub them, the module doesn't use them
          find . -xtype l -not -path './.git/*' | while read l; do rm "$l"; mkdir -p "$l"; touch "$l/Kconfig" "$l/Makefile"; done
          ln -sfn $GITHUB_WORKSPACE/ksu/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          mkdir out
          # further Kconfig files the stubbed oplus dirs would have provided; any Kconfig run trips on them
          for i in $(seq 100); do
            f=$( (make O=out gki_defconfig 2>&1 || true) | sed -n 's/.*can.t open file "\(.*\)"/\1/p' | head -1)
            [ -z "$f" ] && break; echo "stub $f"; mkdir -p "$(dirname "$f")"; touch "$f"
          done
          make O=out gki_defconfig
          c=arch/arm64/configs
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            $c/vendor/pineapple_GKI.config $c/vendor/oplus/pineapple_GKI.config $c/vendor/oplus/waffle.config
          { echo CONFIG_KSU=m; for x in ${{ inputs.ksu_config }}; do echo $x; done; } >> out/.config
          make O=out olddefconfig
          grep -E '^CONFIG_(KSU|USER_NS|LTO_CLANG_THIN|AUTOFDO_CLANG)' out/.config

      - name: Kernel (vmlinux, ThinLTO)
        working-directory: k
        run: |
          make O=out -j$(nproc) vmlinux
          strings out/vmlinux | grep -m1 '^Linux version'

      - name: kernelsu.ko
        working-directory: k
        run: |
          make O=out -j$(nproc) modules_prepare
          cp out/vmlinux.symvers out/Module.symvers
          make O=out -j$(nproc) drivers/kernelsu/kernelsu.ko
          llvm-strip -d -o $GITHUB_WORKSPACE/kernelsu.ko out/drivers/kernelsu/kernelsu.ko
          strings $GITHUB_WORKSPACE/kernelsu.ko | grep -E '^vermagic=|^intree=|@ReSukiSU|welcome to KernelSU'

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ inputs.ksu_ref }}-${{ github.run_id }}
          path: kernelsu.ko
